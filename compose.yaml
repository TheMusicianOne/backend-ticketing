services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketing}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10

  fake-payment-provider:
    build: ./fake-payment-provider
    ports:
      - "8081:8081"
    environment:
      FAKE_PSP_API_KEY: ${PAYMENTS_API_KEY:-test_fake_psp_key}
      FAKE_PSP_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-whsec_local_dev_secret}
      FAKE_PSP_PUBLIC_BASE_URL: ${PSP_PUBLIC_BASE_URL:-http://localhost:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  ticketing-backend:
    build: .
    profiles: ["full"]
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing
      SPRING_DATASOURCE_USERNAME: ticketing
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ticketing}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-it-must-be-at-least-32-bytes}
      APP_PAYMENTS_PROVIDER: http
      APP_PAYMENTS_BASEURL: http://fake-payment-provider:8081
      APP_PAYMENTS_WEBHOOKURL: http://ticketing-backend:8080/webhooks/payments
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-test_fake_psp_key}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-whsec_local_dev_secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      fake-payment-provider:
        condition: service_healthy
  caddy:
    image: caddy:2
    profiles: [ "full" ]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST:-api.localhost}
      PAY_HOST: ${PAY_HOST:-pay.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ticketing-backend
      - fake-payment-provider
  prometheus:
    image: prom/prometheus:latest
    profiles: ["full"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - ticketing-backend
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data: