name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ticketing-backend:
    name: Ticketing backend (Java)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and run tests
        run: ./gradlew build

  fake-payment-provider:
    name: Fake payment provider (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fake-payment-provider

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fake-payment-provider/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Check the Docker image builds
        run: docker build .
  deploy:
    name: Deploy to server
    needs: [ ticketing-backend, fake-payment-provider ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd ~/backend-ticketing
            git pull --ff-only
            docker compose --profile full up -d --build
            docker image prune -f
          EOF

      - name: Check the deployed app is healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://api.2-31-202-145.sslip.io/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          echo "The app did not become healthy in time"
          exit 1