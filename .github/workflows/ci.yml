name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ticketing-backend:
    name: Ticketing backend (Java)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and run tests
        run: ./gradlew build

  fake-payment-provider:
    name: Fake payment provider (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fake-payment-provider

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fake-payment-provider/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Check the Docker image builds
        run: docker build .