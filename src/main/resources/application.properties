spring.application.name=ticketing-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing
spring.datasource.username=ticketing
spring.datasource.password=ticketing

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100
spring.mvc.problemdetails.enabled=true
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-it-must-be-at-least-32-bytes}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
spring.jpa.properties.hibernate.order_updates=true
app.holds.strategy=conditional
app.payments.provider=http
app.payments.base-url=http://localhost:8081
app.payments.api-key=${PAYMENTS_API_KEY:test_fake_psp_key}
app.payments.webhook-url=http://host.docker.internal:8080/webhooks/payments
app.payments.connect-timeout=2s
app.payments.read-timeout=3s
app.payments.webhook-secret=${PAYMENTS_WEBHOOK_SECRET:whsec_local_dev_secret}
app.payments.webhook-tolerance=5m